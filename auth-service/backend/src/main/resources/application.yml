server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: tuneus-auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tuneus_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:tuneus}
    password: ${DB_PASSWORD:tuneus}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    # Must be at least 32 bytes. Generate with: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:tuneus-auth}
    audience: ${JWT_AUDIENCE:tuneus-web}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    cookie-name: ${REFRESH_COOKIE_NAME:tuneus_refresh}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
    # Public OAuth Web Client ID from Google Cloud Console. Never put the client secret here.
    google-client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.tuneus.auth: INFO
    org.springframework.security: WARN
