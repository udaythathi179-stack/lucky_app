services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tuneus_auth
      MYSQL_USER: tuneus
      MYSQL_PASSWORD: tuneus
      MYSQL_ROOT_PASSWORD: tuneus-root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utuneus", "-ptuneus"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tuneus_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: tuneus
      DB_PASSWORD: tuneus
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in auth-service/.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in auth-service/.env}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in auth-service/.env}
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql_data:
